name: Deploy Python App to Azure Container Apps

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-container-app.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY_NAME: pythonappregistry
  APP_NAME: python-container-app
  RESOURCE_GROUP: rg-python-app
  LOCATION: eastus
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================
  # SECURITY SCANNING JOB
  # ============================================================
  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trivy - Scan filesystem for vulnerabilities
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
        continue-on-error: true

      # TruffleHog - Secret Detection
      - name: Run TruffleHog secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --only-verified
        continue-on-error: true

      # Upload results
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  # ============================================================
  # BUILD AND PUSH IMAGE JOB
  # ============================================================
  build-and-push:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Azure Login using OIDC (recommended for GitHub Actions)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Get ACR credentials
      - name: Get ACR credentials
        id: acr_credentials
        run: |
          REGISTRY_URL="${{ env.REGISTRY_NAME }}.azurecr.io"
          echo "registry_url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          
          # Get ACR admin password
          ACR_PASSWORD=$(az acr credential show \
            --name ${{ env.REGISTRY_NAME }} \
            --query passwords[0].value -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      # Login to ACR
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr_credentials.outputs.registry_url }}
          username: ${{ env.REGISTRY_NAME }}
          password: ${{ steps.acr_credentials.outputs.acr_password }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.acr_credentials.outputs.registry_url }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ steps.acr_credentials.outputs.registry_url }}/${{ env.APP_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy - Scan Docker image
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.acr_credentials.outputs.registry_url }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
        continue-on-error: true

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Log out from ACR
        run: docker logout ${{ steps.acr_credentials.outputs.registry_url }}

  # ============================================================
  # INFRASTRUCTURE SETUP JOB
  # ============================================================
  setup-infrastructure:
    name: 🏗️ Setup Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Create Resource Group
      - name: Create Resource Group
        run: |
          echo "Creating resource group: ${{ env.RESOURCE_GROUP }}"
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }}

      # Create ACR (if it doesn't exist)
      - name: Create Azure Container Registry
        run: |
          echo "Checking if ACR exists: ${{ env.REGISTRY_NAME }}"
          ACR_EXISTS=$(az acr check-name \
            --name ${{ env.REGISTRY_NAME }} \
            --query "nameAvailable" -o tsv)
          
          if [ "$ACR_EXISTS" == "true" ]; then
            echo "Creating ACR: ${{ env.REGISTRY_NAME }}"
            az acr create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.REGISTRY_NAME }} \
              --sku Basic \
              --admin-enabled true
            echo "✓ ACR created"
          else
            echo "✓ ACR already exists"
          fi

      # Create Container App Environment
      - name: Create Container App Environment
        run: |
          ENV_NAME="${{ env.APP_NAME }}-env"
          echo "Checking if environment exists: $ENV_NAME"
          
          ENV_EXISTS=$(az containerapp env list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?name=='$ENV_NAME']" -o tsv || echo "")
          
          if [ -z "$ENV_EXISTS" ]; then
            echo "Creating environment: $ENV_NAME"
            az containerapp env create \
              --name "$ENV_NAME" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }}
            echo "✓ Environment created"
          else
            echo "✓ Environment already exists"
          fi

  # ============================================================
  # DEPLOY TO CONTAINER APPS JOB
  # ============================================================
  deploy-container-app:
    name: 🚀 Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: setup-infrastructure
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy or update Container App
      - name: Deploy Container App
        run: |
          ENV_NAME="${{ env.APP_NAME }}-env"
          IMAGE_URL="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
          
          echo "Checking if Container App exists..."
          APP_EXISTS=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || echo "")
          
          if [ -z "$APP_EXISTS" ]; then
            echo "Creating Container App: ${{ env.APP_NAME }}"
            az containerapp create \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment "$ENV_NAME" \
              --image "$IMAGE_URL" \
              --target-port 5000 \
              --ingress 'external' \
              --cpu 0.5 \
              --memory 1.0Gi \
              --min-replicas 1 \
              --max-replicas 3 \
              --env-vars \
                PORT=5000 \
                APP_VERSION=${{ env.IMAGE_TAG }} \
                ENVIRONMENT=production \
              --registry-server ${{ env.REGISTRY_NAME }}.azurecr.io \
              --registry-username ${{ env.REGISTRY_NAME }} \
              --registry-password $(az acr credential show \
                --name ${{ env.REGISTRY_NAME }} \
                --query passwords[0].value -o tsv)
            echo "✓ Container App created"
          else
            echo "Updating Container App: ${{ env.APP_NAME }}"
            az containerapp update \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image "$IMAGE_URL"
            echo "✓ Container App updated"
          fi

      # Get the application URL
      - name: Get Application URL
        id: get_url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "Application URL: https://$FQDN"

      # Wait for deployment to be ready
      - name: Wait for deployment to be ready
        run: |
          for i in {1..30}; do
            echo "Checking deployment status (attempt $i/30)..."
            if curl -f -s "https://${{ steps.get_url.outputs.fqdn }}/health" > /dev/null 2>&1; then
              echo "✓ Deployment is ready!"
              exit 0
            fi
            sleep 10
          done
          echo "⚠ Deployment may still be initializing"

  # ============================================================
  # HEALTH CHECK & VALIDATION JOB
  # ============================================================
  health-check:
    name: ✅ Health Check & Validation
    runs-on: ubuntu-latest
    needs: deploy-container-app
    if: always()
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Get application URL
      - name: Get Application URL
        id: get_url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

      # Test health endpoint
      - name: Test Health Endpoint
        run: |
          echo "Testing health endpoint..."
          curl -v https://${{ steps.get_url.outputs.fqdn }}/health

      # Test API endpoint
      - name: Test API Endpoint
        run: |
          echo "Testing API endpoint..."
          curl -s https://${{ steps.get_url.outputs.fqdn }}/api/hello?name=GitHub | jq .

      # Test status endpoint
      - name: Test Status Endpoint
        run: |
          echo "Testing status endpoint..."
          curl -s https://${{ steps.get_url.outputs.fqdn }}/api/status | jq .

      # Output deployment summary
      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "✅ Deployment Successful!"
          echo "========================================="
          echo "Application URL: https://${{ steps.get_url.outputs.fqdn }}"
          echo ""
          echo "Available endpoints:"
          echo "  - Health: https://${{ steps.get_url.outputs.fqdn }}/health"
          echo "  - API: https://${{ steps.get_url.outputs.fqdn }}/api/hello?name=YourName"
          echo "  - Status: https://${{ steps.get_url.outputs.fqdn }}/api/status"
          echo ""
          echo "Resource details:"
          echo "  - Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo "  - Registry: ${{ env.REGISTRY_NAME }}.azurecr.io"
          echo "  - Container App: ${{ env.APP_NAME }}"
          echo "  - Image Tag: ${{ env.IMAGE_TAG }}"
          echo "========================================="

  # ============================================================
  # NOTIFICATION JOB (Optional - requires Slack webhook)
  # ============================================================
  notify:
    name: 📢 Send Notification
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Application URL
        id: get_url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            -o tsv 2>/dev/null || echo "")
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

      - name: Send Slack Notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Deployment Successful!*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* `${{ github.sha }}`\n\n🔗 *App URL:* https://${{ steps.get_url.outputs.fqdn }}\n📦 *Image:* `${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send Slack Notification on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Deployment Failed!*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* `${{ github.sha }}`\n\n🔗 *View Details:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

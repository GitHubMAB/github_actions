name: AI Code Review

on:
  pull_request:
    types: [opened]
    paths-ignore:
      - '**.md'
      - '**.lock'
      - '.gitignore'
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR ref (for issue_comment trigger)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          PR_DATA=$(gh pr view $PR_NUMBER --json headRefName,baseRefName)
          HEAD=$(echo $PR_DATA | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['headRefName'])")
          BASE=$(echo $PR_DATA | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['baseRefName'])")
          git fetch origin $HEAD $BASE
          git diff origin/$BASE...origin/$HEAD | head -c 8000 > diff.txt

      - name: Get diff (for pull_request trigger)
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | head -c 8000 > diff.txt

      - name: Check diff not empty
        run: |
          if [ ! -s diff.txt ]; then
            echo "Diff vide, rien à reviewer."
            exit 0
          fi

      - name: AI Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request

          with open("diff.txt", "r") as f:
              diff = f.read()

          payload = {
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 1024,
              "messages": [{
                  "role": "user",
                  "content": f"Tu es un expert en code review. Analyse ce diff Git et donne une review concise en français : bugs potentiels, sécurité, améliorations.\n\n{diff}"
              }]
          }

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read())

          review = data["content"][0]["text"]
          print(review)

          with open("review.txt", "w") as f:
              f.write(review)

          EOF

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.txt', 'utf8');
            const issue_number = context.issue?.number || context.payload.pull_request?.number;
            github.rest.issues.createComment({
              issue_number: issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${review}\n\n> 💡 Relancer : tapez \`/review\` en commentaire`
            });

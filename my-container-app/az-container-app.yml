apiVersion: containerapp.io/v1
kind: ContainerApp
metadata:
  name: python-container-app
  resourceGroup: your-resource-group
spec:
  environmentId: /subscriptions/{subscription}/resourceGroups/{resource-group}/providers/Microsoft.App/managedEnvironments/{environment-name}
  template:
    containers:
    - name: python-app
      image: your-registry.azurecr.io/python-container-app:latest
      resources:
        cpu: 0.5
        memory: 1Gi
      env:
      - name: PORT
        value: "5000"
      - name: APP_VERSION
        value: "1.0.0"
      - name: ENVIRONMENT
        value: "production"
      ports:
      - containerPort: 5000
        protocol: tcp
    scale:
      minReplicas: 1
      maxReplicas: 10
      rules:
      - name: http-requests
        custom:
          query: "http_requests_per_second"
          metadata:
            targetQueryValue: "100"
    revisionSuffix: v1
  configuration:
    ingress:
      external: true
      targetPort: 5000
      traffic:
      - latest: true
        weight: 100
    secrets: []
  workloadProfileName: consumption
